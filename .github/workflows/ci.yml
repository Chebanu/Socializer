name: CI

on:
  pull_request:
    branches: [ "**" ]
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Socializer.sln

      - name: Build
        run: dotnet build Socializer.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test Socializer.sln --no-build --configuration Release
